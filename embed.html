<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spin the wheel – Wheelova</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#FFFFFF;--tx:#1A1A22;--mu:#62626F;--ring:#ECECF2;--line:#D6D6DF;--inv:#0A0A0C;--invtx:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0A0A0C;--tx:#EDEDF2;--mu:#A3A3B0;--ring:#17171D;--line:#2A2A33;--inv:#FFFFFF;--invtx:#0A0A0C;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.box{position:relative;width:min(440px,calc(100vh - 140px),100%);aspect-ratio:1}
canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 8px var(--ring),0 0 0 9px var(--line);cursor:pointer}
.ptr{position:absolute;left:50%;top:-8px;transform:translateX(-50%);border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--inv);z-index:2}
#spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:4px solid var(--bg);background:var(--inv);color:var(--invtx);font:700 14px system-ui,sans-serif;letter-spacing:.05em;cursor:pointer;z-index:3}
.out{min-height:34px;font-size:15px;color:var(--mu);text-align:center}
.out.win{font:700 26px/1.2 system-ui,sans-serif;color:var(--tx)}
.credit{font-size:12px;color:var(--mu);text-decoration:none;display:flex;align-items:center;gap:6px}.credit:hover{color:var(--tx)}
</style>
</head>
<body>
<div class="box"><div class="ptr" aria-hidden="true"></div><canvas id="wheel" width="880" height="880" role="img" aria-label="Spinning wheel"></canvas><button id="spin" type="button" aria-label="Spin the wheel">SPIN</button></div>
<div class="out" id="out" aria-live="polite">Click SPIN</div>
<a class="credit" id="credit" href="https://wheelova.com/" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 35 L32 9 A26 26 0 0 1 58 35 Z" fill="#6E56F0"/><path d="M32 35 L58 35 A26 26 0 0 1 32 61 Z" fill="#E11D48"/><path d="M32 35 L32 61 A26 26 0 0 1 6 35 Z" fill="#F59E0B"/><path d="M32 35 L6 35 A26 26 0 0 1 32 9 Z" fill="#16A34A"/><circle cx="32" cy="35" r="6.5" fill="#FFFFFF"/></svg>Made with Wheelova</a>
<script src="/embed.js?v=1"></script>
</body>
</html>
